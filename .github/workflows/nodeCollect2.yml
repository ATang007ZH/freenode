
# GitHub Actions 自动采集节点
name: node collect 2

on:
  schedule:
    - cron: '*/10 * * * *'  # 每10分钟执行一次（UTC时间）
  repository_dispatch:
  workflow_dispatch:

# 允许 GitHub Actions 提交和推送文件
permissions:
  contents: write

# 防止同一个工作流同时运行多个实例
concurrency:
  group: node-collect-2
  cancel-in-progress: false

jobs:
  build:
    # 固定 Ubuntu 24.04，避免系统自动升级造成兼容问题
    runs-on: ubuntu-24.04

    steps:
      # 1. 获取仓库代码
      - name: Checkout repository
        uses: actions/checkout@v6

      # 2. 获取远程节点并生成文件
      - name: Collect nodes
        shell: bash
        run: |
          set -euo pipefail

          echo "开始获取节点..."

          curl -fsSL --retry 3 --retry-delay 5 \
            https://s3.dualstack.us-east-1.amazonaws.com/zhifan/wiki.html \
            | grep -oP '(?:anytls|vmess|ssr|ss)\x3A\x2F\x2F[^\s"<]+' \
            > ./freenode2.txt || true

          # 清理 HTML 转义字符
          sed -i 's/amp;//g' ./freenode2.txt

          # 生成 Base64 文件
          base64 -w 0 ./freenode2.txt > ./freenode2-base64

          echo "节点数量：$(wc -l < ./freenode2.txt)"

      # 3. 对比文件，有变化才提交
      - name: Compare and push changes
        shell: bash
        run: |
          set -euo pipefail

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'

          # 注意：这里比较的是工作区与 HEAD 的差异
          if ! git diff --quiet HEAD -- freenode2.txt freenode2-base64; then

            echo "检测到节点文件发生变化，准备提交..."

            echo "1-检查时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')" > status

            git add freenode2.txt freenode2-base64 status

            git commit -m "节点更新时间：$(TZ=Asia/Shanghai date '+%Y-%m-%d %H:%M:%S')"

            git push

            echo "节点更新成功！"

          else

            echo "节点没有变化，不提交无意义的更新。"

          fi
